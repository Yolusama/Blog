<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EF Core Migration 管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="message.css">
    <link rel="stylesheet" href="message-box.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="page-header">
        <h1 class="h4 mb-1">EF Core Migration 管理</h1>
        <p class="text-muted small mb-0">查看、新增与更新数据库迁移记录</p>
    </div>

    <div class="toolbar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex gap-2">
            <label for="searchInput" class="visually-hidden">按名称搜索</label>
            <input id="searchInput" class="form-control form-control-sm search-input"
                   placeholder="按名称搜索" aria-label="按名称搜索迁移" maxlength="120">
            <button type="button" class="btn btn-outline-primary btn-sm" id="searchBtn" style="width: 60px;">搜索</button>
        </div>
        <div class="d-flex gap-3">
            <button type="button" class="btn btn-warning" id="removeLatestBtn">移除最新未应用迁移</button>
            <button type="button" class="btn btn-primary" id="addMigrationBtn">添加迁移</button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive table-scroll">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>创建时间</th>
                        <th>文件名</th>
                        <th>应用时间</th>
                        <th class="text-center">操作</th>
                    </tr>
                    </thead>
                    <tbody id="migrationTableBody">
                    <tr id="loadDataRow">
                        <td colspan="6" class="text-center py-4 text-muted">加载中...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small" id="pageInfo">共 0 条</span>
                <label for="pageSizeSelect" class="small text-muted mb-0">每页</label>
                <select id="pageSizeSelect" class="form-select form-select-sm page-size-select">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <nav aria-label="迁移分页">
                <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="migrationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="migrationForm">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="modalTitle">添加迁移</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="migrationName" class="form-label">迁移名称</label>
                    <input id="migrationName" name="name" class="form-control" required maxlength="120">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="message.js"></script>
<script src="message-box.js"></script>
<script src="index.js"></script>
</body>
</html>
